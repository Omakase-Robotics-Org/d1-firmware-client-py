name: CI

# No org secrets: this package has no private dependencies and no dependencies
# at all. A runner with a stock Python can check the whole thing, which is the
# point — the consumer-facing half of the firmware contract must not need the
# firmware repository to be verifiable.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in pyproject (the robot images); 3.12 is
        # what a fresh venv gets. Both, or the floor rots.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Tests
        # Includes tests/test_spec_contract.py: every (method, path) the client
        # can send is checked against the vendored OpenAPI document, so a
        # refreshed spec that dropped or renamed a route fails here rather than
        # on a robot.
        run: pytest -q -rs
      - name: The vendored spec ships INSIDE the wheel
        # A consumer has the firmware binary and this package, never a firmware
        # checkout. If package-data stops carrying openapi/, `spec_version()`
        # raises FileNotFoundError on every robot and nothing in the source
        # tree notices. Run from / so a stray relative path cannot save it.
        run: |
          pip install --force-reinstall --no-deps .
          cd / && python -c "import d1fw_client; print('spec', d1fw_client.spec_version())"

  version-bump:
    # Consumers pin this repository by COMMIT; pip decides whether to reinstall
    # by VERSION. A change that moves what consumers import while leaving
    # project.version alone installs "successfully" on a robot and changes
    # nothing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # This gate is a DIFF against the base branch. The default depth-1
          # checkout has no base commit on disk and the check would skip itself
          # on every run.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: A change consumers must pick up carries a version bump
        # stdlib only, and no install step: the gate has to run even when the
        # package itself does not build.
        run: python tools/check_version_bump.py
